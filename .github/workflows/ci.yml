# Módulo 6 — CI como gate obligatorio: lint → typecheck → unit → integration → e2e.
# Módulo 11 — + audit de dependencias (solo runtime), build de la imagen Docker
# (push a GHCR en main) y smoke contra el sistema completo con docker compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + build + tests (pirámide)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack
        ports:
          # El app espera la DB en 5433 (igual que el compose local).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Módulo 7: los e2e y la app usan Redis para las colas BullMQ.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5433/jobtrack?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias (legacy-peer-deps obligatorio)
        run: npm ci --legacy-peer-deps

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + build (nest build)
        run: npm run build

      - name: Unit tests (lógica pura, repos mockeados)
        run: npm test

      - name: Integration tests (Services + Repos + Postgres real)
        run: npm run test:integration

      - name: E2E tests (contrato HTTP completo)
        run: npm run test:e2e

  audit:
    name: dependencias (runtime) sin hallazgos high+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps
      - name: npm audit — solo producción (runtime)
        # El runtime va limpio. @nestjs/mau y vitepress (dev tooling) tienen
        # hallazgos documentados en docs/guide/security-checklist.md y NO se
        # envían a la imagen (npm prune --omit=dev en el Dockerfile).
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: build imagen (push a GHCR en main)
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR (solo main)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/jobtrack-api:latest
            ghcr.io/${{ github.repository }}/jobtrack-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-containers:
    name: smoke contra compose (sistema completo)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema completo (compose)
        run: docker compose up -d --build

      - name: Esperar a que el API pase healthcheck
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            sleep 2
          done
          echo "El API no respondió a tiempo"; docker compose logs api; exit 1

      - name: Sembrar datos de desarrollo (admin del smoke)
        run: docker compose run --rm api node dist/database/seed.js

      - name: Smoke autenticado (RBAC, paginación, rotation)
        env:
          SMOKE_BASE: http://localhost:3000
        run: node scripts/smoke.mjs

      - name: Teardown
        if: always()
        run: docker compose down -v
